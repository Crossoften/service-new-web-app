<div class="ordenacao">
  <button type="button" class="ordenacao__btn" [class.ordenacao__btn--ativo]="valor() !== 'relevancia'" (click)="toggle()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="21" y1="10" x2="7" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/>
      <line x1="21" y1="14" x2="7" y2="14"/><line x1="21" y1="18" x2="3" y2="18"/>
    </svg>
    <span>{{ label }}</span>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      [style.transform]="aberto ? 'rotate(180deg)' : 'rotate(0)'">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>
  @if (aberto) {
    <div class="ordenacao__opcoes">
      @for (o of opcoes; track o.id) {
        <div class="ordenacao__opcao" [class.ordenacao__opcao--ativo]="valor() === o.id" (click)="selecionar(o.id)">
          {{ o.label }}
        </div>
      }
    </div>
  }
</div>
