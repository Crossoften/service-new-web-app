<div class="mapa-rota">
  <div #mapa class="mapa-rota__canvas" [hidden]="indisponivel"></div>

  @if (carregando && !indisponivel) {
    <div class="mapa-rota__overlay">Carregando rota…</div>
  }

  @if (indisponivel) {
    <div class="mapa-rota__overlay">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span>Rota no mapa indisponível</span>
    </div>
  }
</div>
