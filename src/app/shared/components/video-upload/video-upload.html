<div class="video-upload">
  <label class="video-upload__label">{{ label }}</label>

  @if (url) {
    <video class="video-upload__preview" [src]="url" controls playsinline></video>
    <button type="button" class="video-upload__remover" (click)="remover()" [disabled]="enviando">
      Remover vídeo
    </button>
  } @else if (enviando) {
    <p class="video-upload__status">Enviando vídeo…</p>
  } @else {
    <label class="video-upload__botao">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      Anexar vídeo
      <input type="file" [accept]="videoAccept" (change)="selecionar($event)" hidden />
    </label>
  }

  @if (erro) { <p class="video-upload__erro">{{ erro }}</p> }
</div>
