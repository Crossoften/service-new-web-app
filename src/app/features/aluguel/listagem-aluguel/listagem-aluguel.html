<div class="page-container">

  <div class="la-header">
    <button class="la-header__voltar" (click)="voltar()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <span class="la-header__titulo">{{ categoriaNome || 'Aluguel' }}</span>
    <div style="width: 22px"></div>
  </div>

  <div class="la-busca">
    <input type="text" placeholder="O QUE VOCÊ PROCURA?" [(ngModel)]="busca" (keyup.enter)="buscar()" />
    <button class="la-busca__btn" (click)="buscar()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
  </div>

  <div class="page-content">
    @if (carregando) {
      <p class="la-msg">Carregando…</p>
    } @else if (erro) {
      <p class="la-msg">{{ erro }}</p>
    } @else if (produtos.length === 0) {
      <p class="la-msg">Nenhum item disponível para aluguel.</p>
    } @else {
      <div class="la-grid">
        @for (p of produtos; track p.id) {
          <div class="la-card" (click)="abrirProduto(p.id)">
            <div class="la-card__img">
              @if (p.imageUrl) {
                <img [src]="p.imageUrl" [alt]="p.name" />
              } @else {
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                  <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
                </svg>
              }
            </div>
            <div class="la-card__body">
              <span class="la-card__nome">{{ p.name }}</span>
              <span class="la-card__preco">{{ formatarPreco(p.price) }}</span>
            </div>
          </div>
        }
      </div>
    }
  </div>

</div>
