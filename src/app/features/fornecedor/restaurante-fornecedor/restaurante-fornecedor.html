<div class="rest-container">

  <div class="rest-header">
    <button class="rest-header__voltar" (click)="voltar()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <span class="rest-header__titulo">{{ modoEdicao ? 'MEU RESTAURANTE' : 'CRIAR RESTAURANTE' }}</span>
    <div style="width: 30px"></div>
  </div>

  <div class="rest-content">

    @if (carregando) {
      <p class="rest-msg">Carregando…</p>
    } @else {
      <div class="rest-form">

        <div class="rest-field">
          <label>Nome</label>
          <input type="text" placeholder="Nome do restaurante" [(ngModel)]="nome" />
        </div>

        <div class="rest-field">
          <label>Descrição</label>
          <textarea rows="3" placeholder="Descrição" [(ngModel)]="descricao"></textarea>
        </div>

        <div class="rest-field">
          <label>Categoria</label>
          <div class="rest-select" (click)="toggleCategoria()">
            <span>{{ categoriaLabel }}</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              [style.transform]="categoriaAberta ? 'rotate(180deg)' : 'rotate(0)'">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
          @if (categoriaAberta) {
            <div class="rest-opcoes">
              @for (cat of categorias; track cat.id) {
                <div class="rest-opcao" [class.rest-opcao--ativo]="categoriaId === cat.id" (click)="selecionarCategoria(cat)">
                  {{ cat.name }}
                </div>
              }
            </div>
          }
        </div>

        @if (modoEdicao) {
          <div class="rest-toggle" (click)="toggleAberto()">
            <span>Loja {{ aberto ? 'aberta' : 'fechada' }}</span>
            <div class="rest-toggle__switch" [class.rest-toggle__switch--on]="aberto">
              <div class="rest-toggle__bola"></div>
            </div>
          </div>
        }

        @if (erro) { <span class="rest-erro">{{ erro }}</span> }
      </div>
    }

  </div>

  <div class="rest-actions">
    <button class="rest-btn" (click)="salvar()" [disabled]="salvando">
      {{ salvando ? 'SALVANDO…' : (modoEdicao ? 'SALVAR' : 'CRIAR RESTAURANTE') }}
    </button>
  </div>

</div>
