<div class="hub-container">

  <div class="hub-header">
    <div>
      <span class="hub-header__eyebrow">Painel do fornecedor</span>
      <h1 class="hub-header__titulo">O que você quer gerenciar?</h1>
    </div>
    <button class="hub-header__perfil" (click)="irPerfil()" aria-label="Perfil">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </button>
  </div>

  <p class="hub-descricao">Sua conta pode atuar em várias categorias. Escolha uma para começar.</p>

  <!-- URGÊNCIA / PENDÊNCIAS (E2E-2a) — cards separados por tipo -->
  @if (trabalhosAprovados > 0) {
    <button class="hub-alerta" (click)="irTrabalhos()">
      <div class="hub-alerta__icone">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
        </svg>
      </div>
      <div class="hub-alerta__info">
        <span class="hub-alerta__titulo">
          {{ trabalhosAprovados === 1 ? 'Trabalho aprovado — inicie' : trabalhosAprovados + ' trabalhos aprovados — inicie' }}
        </span>
        <span class="hub-alerta__sub">Serviços · o cliente aprovou o orçamento</span>
      </div>
      <svg class="hub-alerta__seta" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  }

  @if (orcamentosPendentes > 0) {
    <button class="hub-alerta" (click)="irOrcamentos()">
      <div class="hub-alerta__icone">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
      </div>
      <div class="hub-alerta__info">
        <span class="hub-alerta__titulo">
          {{ orcamentosPendentes === 1 ? 'Orçamento a responder' : orcamentosPendentes + ' orçamentos a responder' }}
        </span>
        <span class="hub-alerta__sub">Serviços · aguardando sua resposta</span>
      </div>
      <svg class="hub-alerta__seta" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  }

  <div class="hub-grid">
    @for (vertical of verticais; track vertical.rota) {
      <button class="hub-card" (click)="abrir(vertical)">
        <span class="hub-card__icone">{{ vertical.icone }}</span>
        <span class="hub-card__titulo">{{ vertical.titulo }}</span>
        <span class="hub-card__descricao">{{ vertical.descricao }}</span>
      </button>
    }
  </div>

  <button class="hub-assinaturas" (click)="irMensagens()">
    <span class="hub-assinaturas__icone">💬</span>
    <span class="hub-assinaturas__texto">Mensagens</span>
    @if (unread.total() > 0) {
      <span class="hub-assinaturas__badge">{{ unread.total() > 99 ? '99+' : unread.total() }}</span>
    }
    <svg class="hub-assinaturas__seta" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </button>

  <button class="hub-assinaturas" (click)="irAssinaturas()">
    <span class="hub-assinaturas__icone">💳</span>
    <span class="hub-assinaturas__texto">Minhas assinaturas</span>
    <svg class="hub-assinaturas__seta" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </button>

</div>
