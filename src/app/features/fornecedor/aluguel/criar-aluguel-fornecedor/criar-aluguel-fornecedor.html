<div class="page-container">

  <div class="ca-header">
    <button class="ca-header__voltar" (click)="voltar()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <span class="ca-header__titulo">{{ titulo }}</span>
    <div style="width: 22px"></div>
  </div>

  <div class="page-content">
    @if (carregando) {
      <p class="ca-msg">Carregando…</p>
    } @else {
      <div class="ca-form">

        <!-- TIPO (somente leitura) -->
        <div class="ca-tipo">
          <span class="ca-tipo__label">Negociação</span>
          <span class="ca-tipo__valor">{{ tipoLabel }}</span>
        </div>

        <!-- CATEGORIA -->
        <div class="ca-field">
          <label>Categoria</label>
          <select [(ngModel)]="categoryId" class="ca-field__select">
            <option [ngValue]="undefined" disabled>Selecione…</option>
            @for (c of categorias; track c.id) {
              <option [ngValue]="c.id">{{ c.name }}</option>
            }
          </select>
          @if (semCategorias) {
            <span class="ca-erro">Nenhuma categoria disponível no momento. Contate o administrador.</span>
          }
        </div>

        <!-- NOME -->
        <div class="ca-field">
          <label>Nome</label>
          <input type="text" placeholder="Nome do item" [(ngModel)]="nome" />
        </div>

        <!-- MODELO / ANO -->
        <div class="ca-field ca-field--row">
          <div class="ca-field">
            <label>Modelo</label>
            <input type="text" placeholder="Opcional" [(ngModel)]="modelo" />
          </div>
          <div class="ca-field">
            <label>Ano</label>
            <input type="number" placeholder="Opcional" [(ngModel)]="ano" />
          </div>
        </div>

        <!-- VALOR -->
        <div class="ca-field">
          <label>Valor (R$)</label>
          <input type="text" inputmode="numeric" placeholder="R$ 0,00"
              [ngModel]="preco" (ngModelChange)="onPrecoInput($event)" />
        </div>

        <!-- DESCRIÇÃO -->
        <div class="ca-field">
          <label>Descrição</label>
          <textarea rows="4" placeholder="Detalhes do item" [(ngModel)]="descricao"></textarea>
        </div>

        <!-- ATIVO -->
        <label class="ca-toggle">
          <input type="checkbox" [(ngModel)]="ativo" />
          <span>Item ativo (visível no catálogo)</span>
        </label>

        <!-- IMAGEM -->
        <div class="ca-imagem">
          <div class="ca-imagem__preview">
            @if (imageUrl) {
              <img [src]="imageUrl" alt="Foto do item" />
            } @else {
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
              </svg>
            }
          </div>
          <label class="ca-imagem__btn">
            {{ enviandoFoto ? 'Enviando…' : 'Escolher imagem' }}
            <input type="file" accept="image/png,image/jpeg" (change)="adicionarImagem($event)" hidden />
          </label>
        </div>

        @if (erro) {
          <span class="ca-erro">{{ erro }}</span>
        }
      </div>
    }
  </div>

  @if (!carregando) {
    <div class="ca-actions">
      <button class="ca-btn" (click)="salvar()" [disabled]="salvando || enviandoFoto">
        {{ salvando ? 'SALVANDO…' : 'SALVAR' }}
      </button>
    </div>
  }

</div>
