<div class="page-container">

  <!-- HEADER -->
  <div class="add-header">
    <button class="add-header__voltar" (click)="cancelar()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <div class="add-header__restaurante">
      <div class="add-header__logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 11l19-9-9 19-2-8-8-2z"/>
        </svg>
      </div>
      <div class="add-header__info">
        <span class="add-header__nome">{{ modoEdicao ? 'Editar item' : 'Novo item' }}</span>
      </div>
    </div>
    <button class="add-header__sino">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>
  </div>

  <div class="page-content">
    <div class="add-form">

      <!-- NOME -->
      <div class="add-field">
        <label>Nome</label>
        <input type="text" placeholder="Nome" [(ngModel)]="nome" />
      </div>

      <!-- DESCRIÇÃO -->
      <div class="add-field">
        <label>Descrição</label>
        <textarea placeholder="Descrição" [(ngModel)]="descricao" rows="4"></textarea>
      </div>

      <!-- VALOR -->
      <div class="add-field">
        <label>Valor (R$)</label>
        <input type="number" placeholder="Valor (R$)" [(ngModel)]="valor" />
      </div>

      <!-- CATEGORIA -->
      <div class="add-field">
        <label>Categoria</label>
        <div class="add-field__select" (click)="toggleCategoria()">
          <span>{{ categoriaSelecionadaLabel }}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            [style.transform]="categoriaAberta ? 'rotate(180deg)' : 'rotate(0)'">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        @if (categoriaAberta) {
          <div class="add-field__opcoes">
            @for (cat of categorias; track cat.id) {
              <div class="add-field__opcao"
                [class.add-field__opcao--ativo]="categoriaSelecionadaId === cat.id"
                (click)="selecionarCategoria(cat)">
                {{ cat.nome }}
              </div>
            }
          </div>
        }
      </div>

      <!-- NOVA CATEGORIA -->
      <div class="add-field">
        <label>Nova categoria <span style="font-weight:400;color:var(--color-gray-400)">(opcional)</span></label>
        <input type="text" placeholder="Criar uma nova categoria" [(ngModel)]="novaCategoria" />
      </div>

      <!-- IMAGEM -->
      <div class="add-field">
        <label>Imagem</label>
        <div class="add-field__arquivo" (click)="selecionarArquivo()">
          <span>{{ arquivo || 'Arquivo' }}</span>
          <button class="add-field__arquivo-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="8 12 12 16 16 12"/>
              <line x1="12" y1="8" x2="12" y2="16"/>
            </svg>
          </button>
        </div>
      </div>

      @if (erro) {
        <span class="add-erro">{{ erro }}</span>
      }

    </div>
  </div>

  <!-- BOTÕES -->
  <div class="add-actions">
    <button class="add-btn add-btn--outline" (click)="cancelar()" [disabled]="salvando">CANCELAR</button>
    <button class="add-btn add-btn--primary" (click)="salvar()" [disabled]="salvando">
      {{ salvando ? 'SALVANDO…' : 'SALVAR' }}
    </button>
  </div>

</div>
