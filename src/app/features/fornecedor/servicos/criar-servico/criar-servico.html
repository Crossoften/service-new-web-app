<div class="page-container">

  <div class="cs-header">
    <button class="cs-header__voltar" (click)="voltar()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <span class="cs-header__titulo">Serviço</span>
    <div style="width: 30px"></div>
  </div>

  <div class="page-content">
    <div class="cs-form">

      <div class="cs-form__titulo-row">
        <h3 class="cs-form__titulo">Criar novo serviço</h3>
        @if (bloqueado) {
          <span class="cs-form__badge-bloqueado">Bloqueado</span>
        }
      </div>

      <!-- NOME -->
      <div class="cs-field">
        <label>Nome</label>
        <input type="text" placeholder="Nome do serviço" [(ngModel)]="nome" />
      </div>

      <!-- CATEGORIA -->
      <div class="cs-field">
        <label>Categoria</label>
        <select [(ngModel)]="categoryId" class="cs-field__categoria">
          <option [ngValue]="undefined" disabled>Selecione…</option>
          @for (c of categorias; track c.id) {
            <option [ngValue]="c.id">{{ c.name }}</option>
          }
        </select>
      </div>

      <!-- TIPO -->
      <div class="cs-field">
        <label>Tipo</label>
        <div class="cs-field__select" (click)="toggleTipo()">
          <span>{{ tipo }}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            [style.transform]="tipoAberto ? 'rotate(180deg)' : 'rotate(0)'">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        @if (tipoAberto) {
          <div class="cs-field__opcoes">
            @for (t of tipos; track t) {
              <div class="cs-field__opcao"
                [class.cs-field__opcao--ativo]="tipo === t"
                (click)="selecionarTipo(t)">
                {{ t }}
              </div>
            }
          </div>
        }
      </div>

      <!-- REGISTRO -->
      <div class="cs-field">
        <label>Registro</label>
        <input type="text" placeholder="Ex: CREA, CRM, etc" [(ngModel)]="registro" />
      </div>

      <!-- VALOR -->
      <div class="cs-field">
        <label>Valor</label>
        <input type="text" inputmode="numeric" placeholder="R$ 0,00"
          [ngModel]="valor" (ngModelChange)="onValorInput($event)" />
      </div>

      <!-- DESCRIÇÃO -->
      <div class="cs-field">
        <textarea placeholder="Descrição" [(ngModel)]="descricao" rows="5"></textarea>
      </div>

      <!-- IMAGEM -->
      <div class="cs-imagem">
        <h3 class="cs-imagem__titulo">Adicione uma imagem</h3>
        <div class="cs-imagem__wrapper">
          <div class="cs-imagem__placeholder">
            @if (imagem) {
              <img [src]="imagem" alt="imagem" />
            } @else {
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            }
          </div>
          <label class="cs-imagem__fab">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <input type="file" accept="image/png,image/jpeg" (change)="adicionarImagem($event)" hidden />
          </label>
        </div>
      </div>

      @if (erro) {
        <span class="cs-erro">{{ erro }}</span>
      }

    </div>
  </div>

  <div class="cs-actions">
    <button class="cs-btn" (click)="criarServico()" [disabled]="salvando || enviandoFoto">
      {{ salvando ? 'SALVANDO…' : (modoEdicao ? 'SALVAR' : 'CRIAR SERVIÇO') }}
    </button>
  </div>

</div>
