<div class="rec-container">

  <div class="rec-header">
    <button class="rec-header__voltar" (click)="reenviarCodigo()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <span class="rec-header__titulo">REDEFINIR SENHA</span>
    <div style="width: 30px"></div>
  </div>

  <div class="rec-content">

    <h2 class="rec-titulo">Nova senha</h2>
    <p class="rec-descricao">
      Digite o código de 6 dígitos que enviamos@if (destinoExibicao) { para <strong>{{ destinoExibicao }}</strong> } e cadastre uma nova senha.
    </p>

    <div class="rec-form">
      <div class="rec-field">
        <label>Código</label>
        <div class="rec-otp">
          @for (i of [0, 1, 2, 3, 4, 5]; track i) {
            <input
              #otp
              class="rec-otp__box"
              type="tel"
              inputmode="numeric"
              maxlength="1"
              autocomplete="one-time-code"
              [value]="digitos[i]"
              (input)="onOtpInput($event, i)"
              (keydown)="onOtpKeydown($event, i)"
              (paste)="onOtpPaste($event)" />
          }
        </div>
      </div>

      <div class="rec-field">
        <label>Nova senha</label>
        <div class="rec-field__input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input [type]="senhaVisivel ? 'text' : 'password'" placeholder="••••••••••" [(ngModel)]="senha" />
          <button class="rec-field__toggle" (click)="toggleSenha()">
            @if (senhaVisivel) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <div class="rec-field">
        <label>Confirme a nova senha</label>
        <div class="rec-field__input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input [type]="confirmarSenhaVisivel ? 'text' : 'password'" placeholder="••••••••••" [(ngModel)]="confirmarSenha" />
          <button class="rec-field__toggle" (click)="toggleConfirmarSenha()">
            @if (confirmarSenhaVisivel) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      @if (erro) {
        <span class="rec-erro">{{ erro }}</span>
      }

      <button class="rec-link" (click)="reenviarCodigo()">
        Não recebeu o código? Reenviar
      </button>
    </div>

  </div>

  <div class="rec-actions">
    <button class="rec-btn rec-btn--primary" (click)="redefinir()" [disabled]="carregando">
      {{ carregando ? 'SALVANDO…' : 'REDEFINIR SENHA' }}
    </button>
  </div>

</div>
