<div class="login-container">

  <div class="login-header">
    <span class="login-header__titulo">LOGIN</span>
  </div>

  <div class="login-content">

    <div class="login-logo">
      <img src="assets/logo.png" alt="Service" />
    </div>

    <div class="login-form">

      <div class="login-field">
        <label>E-mail ou telefone</label>
        <div class="login-field__input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-10 6L2 7"/>
          </svg>
          <input
            type="text"
            placeholder="seu@email.com ou (00) 00000-0000"
            [ngModel]="identificador"
            (ngModelChange)="onIdentificadorInput($event)"
            autocomplete="username"
            inputmode="email"
          />
        </div>
      </div>

      <div class="login-field">
        <label>Senha</label>
        <div class="login-field__input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            [type]="senhaVisivel ? 'text' : 'password'"
            placeholder="••••••••••"
            [(ngModel)]="senha"
          />
          <button class="login-field__toggle" (click)="toggleSenha()">
            @if (senhaVisivel) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      @if (erro) {
        <span class="login-erro">{{ erro }}</span>
      }
      @if (reenvioMsg) {
        <span class="login-info">{{ reenvioMsg }}</span>
      }

      <button class="login-link" (click)="esqueceuSenha()">
        Esqueci minha senha
      </button>

      <button class="login-link" (click)="reenviarCodigo()" [disabled]="reenviando">
        {{ reenviando ? 'Reenviando…' : 'Não recebeu o código de confirmação?' }}
      </button>

    </div>

  </div>

  <div class="login-actions">
    <button class="login-btn login-btn--primary" (click)="entrar()" [disabled]="carregando">
      {{ carregando ? 'ENTRANDO…' : 'ENTRAR' }}
    </button>
    <button class="login-btn login-btn--outline" (click)="cadastrar()">
      CADASTRE-SE
    </button>
  </div>

</div>
