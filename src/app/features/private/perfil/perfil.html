<div class="perfil-container">

  <div class="perfil-header">
    <button class="perfil-header__voltar" (click)="voltar()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <span class="perfil-header__titulo">MEU PERFIL</span>
    <button class="perfil-header__sair" (click)="sair()" title="Sair">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="perfil-content">

    @if (carregando) {
      <p class="perfil-loading">Carregando perfil…</p>
    } @else {

      <!-- AVATAR -->
      <div class="perfil-avatar-wrap">
        <div class="perfil-avatar">
          @if (fileUrl) {
            <img [src]="fileUrl" alt="Foto de perfil" />
          } @else {
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          }
          <label class="perfil-avatar__edit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
            </svg>
            <input type="file" accept="image/*" (change)="onFotoSelecionada($event)" hidden />
          </label>
        </div>
        @if (fileUrl) {
          <button class="perfil-link" (click)="removerFoto()">Remover foto</button>
        }
      </div>

      @if (erro) { <span class="perfil-erro">{{ erro }}</span> }
      @if (aviso) { <span class="perfil-aviso">{{ aviso }}</span> }

      <!-- DADOS -->
      <div class="perfil-secao">
        <span class="perfil-secao__titulo">Dados</span>

        <div class="perfil-field">
          <label>Nome</label>
          <input type="text" [(ngModel)]="nome" placeholder="Seu nome" />
        </div>

        <div class="perfil-field">
          <label>Email</label>
          <input type="email" [value]="email" disabled />
        </div>

        <div class="perfil-field">
          <label>Telefone</label>
          <input type="tel" [(ngModel)]="telefone" placeholder="(00) 00000-0000" />
        </div>

        <div class="perfil-field">
          <label>Documento</label>
          <input type="text" [(ngModel)]="documento" placeholder="CPF/CNPJ" />
        </div>

        <div class="perfil-field">
          <label>Biografia</label>
          <textarea rows="3" [(ngModel)]="biografia" placeholder="Fale um pouco sobre você"></textarea>
        </div>

        <button class="perfil-btn perfil-btn--primary" (click)="salvarDados()" [disabled]="salvandoDados">
          {{ salvandoDados ? 'SALVANDO…' : 'SALVAR DADOS' }}
        </button>
      </div>

      <!-- ENDEREÇO -->
      <div class="perfil-secao">
        <span class="perfil-secao__titulo">Endereço</span>

        <div class="perfil-field">
          <label>CEP</label>
          <input type="tel" [(ngModel)]="cep" placeholder="00000-000" />
        </div>

        <div class="perfil-field">
          <label>Rua</label>
          <input type="text" [(ngModel)]="rua" placeholder="Rua / Avenida" />
        </div>

        <div class="perfil-form__row">
          <div class="perfil-field">
            <label>Número</label>
            <input type="text" [(ngModel)]="numero" placeholder="Nº" />
          </div>
          <div class="perfil-field">
            <label>Bairro</label>
            <input type="text" [(ngModel)]="bairro" placeholder="Bairro" />
          </div>
        </div>

        <div class="perfil-form__row">
          <div class="perfil-field">
            <label>Cidade</label>
            <input type="text" [(ngModel)]="cidade" placeholder="Cidade" />
          </div>
          <div class="perfil-field perfil-field--uf">
            <label>UF</label>
            <input type="text" [(ngModel)]="estado" placeholder="UF" maxlength="2" />
          </div>
        </div>

        <button class="perfil-btn perfil-btn--outline" (click)="salvarEndereco()" [disabled]="salvandoEndereco">
          {{ salvandoEndereco ? 'SALVANDO…' : 'SALVAR ENDEREÇO' }}
        </button>
      </div>

      <!-- COBRANÇA (fornecedor) -->
      @if (isSupplier) {
        <div class="perfil-secao">
          <span class="perfil-secao__titulo">Modelo de cobrança</span>
          <p class="perfil-secao__hint">Como você prefere ser cobrado nas suas operações.</p>

          <div class="perfil-billing">
            <button
              class="perfil-billing__opt"
              [class.perfil-billing__opt--ativo]="billingType === 'Subscription'"
              (click)="selecionarCobranca('Subscription')"
              [disabled]="salvandoCobranca">
              Assinatura
            </button>
            <button
              class="perfil-billing__opt"
              [class.perfil-billing__opt--ativo]="billingType === 'Commission'"
              (click)="selecionarCobranca('Commission')"
              [disabled]="salvandoCobranca">
              Comissão
            </button>
          </div>
        </div>
      }

    }

  </div>

</div>
