<div class="page-container">

  <div class="home-header">
    <div class="home-user" (click)="toggleDevMenu()">
      <div class="home-avatar">
        <span>{{ inicial }}</span>
      </div>
      <div class="home-user-info">
        <span class="home-welcome">Bem vindo</span>
        <span class="home-name">{{ nomeExibicao }}</span>
      </div>
    </div>
    <button class="home-bell">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>
  </div>

  <!-- DEV MENU -->
  @if (devMenuAberto) {
    <div class="dev-menu">
      <p class="dev-menu__titulo">🛠 Atalhos Dev</p>
      <div class="dev-menu__grid">
        <button (click)="navegar('/perfil')">Perfil</button>
        <button (click)="sair()">Sair (logout)</button>
        <button (click)="navegar('/fornecedor/home')">Fornecedor</button>
        <button (click)="navegar('/fornecedor/servicos')">Forn. Serviços</button>
        <button (click)="navegar('/entregador/home')">Entregador</button>
        <button (click)="navegar('/parceiro/home')">Parceiro</button>
        <button (click)="navegar('/compra-vender/meus-produtos')">Meus Produtos (Venda)</button>
        <button (click)="navegar('/compra-vender/negociacoes')">Negociações</button>
        <button (click)="navegar('/aluguel/meus')">Meus Aluguéis</button>
        <button (click)="navegar('/transporte/meus')">Meus Transportes</button>
        <button (click)="navegar('/hospedagem/reservas')">Minhas Reservas</button>
        <button (click)="navegar('/empregos/candidaturas')">Minhas Candidaturas</button>
<!--    
        <button (click)="navegar('/delivery')">Delivery</button>
        <button (click)="navegar('/servicos')">Serviços</button>
        <button (click)="navegar('/servicos/solicitacoes')">Solicitações</button>
        <button (click)="navegar('/servicos/orcamentos')">Orçamentos</button>
        <button (click)="navegar('/parceiro/mais')">Mais Parceiro</button>
        <button (click)="navegar('/parceiro/saldo')">Saldo</button>
      <button (click)="navegar('/cadastro/cliente')">Cad. Cliente</button> -->
      </div>
    </div>
  }

  <div class="page-content">

    <!-- DESTAQUE: PEDIDO EM ANDAMENTO -->
    @if (pedidoAtivo) {
      <button class="home-pedido-ativo" (click)="verPedidos()">
        <div class="home-pedido-ativo__icone">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div class="home-pedido-ativo__info">
          <span class="home-pedido-ativo__titulo">
            @if (pedidosAtivos.length > 1) {
              {{ pedidosAtivos.length }} pedidos em andamento
            } @else {
              Pedido em andamento
            }
          </span>
          <span class="home-pedido-ativo__sub">{{ pedidoAtivo.restaurant.name }} · {{ statusLabel(pedidoAtivo.status) }}</span>
        </div>
        <svg class="home-pedido-ativo__seta" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    }

    <div class="home-servicos">
      @for (servico of servicos; track servico.label) {
        <button
          class="home-servico-btn"
          [class.disabled]="!servico.rota"
          (click)="navegar(servico.rota)">
          {{ servico.label }}
        </button>
      }
    </div>
  </div>

  <app-bottom-nav-cliente tabAtiva="inicio"></app-bottom-nav-cliente>

</div>
