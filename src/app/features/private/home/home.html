<div class="page-container">

  <div class="home-header">
    <div class="home-user" (click)="navegar('/perfil')">
      <div class="home-avatar">
        @if (fotoUrl) {
          <img [src]="fotoUrl" alt="Foto de perfil" />
        } @else {
          <span>{{ inicial }}</span>
        }
      </div>
      <div class="home-user-info">
        <span class="home-welcome">Bem vindo</span>
        <span class="home-name">{{ nomeExibicao }}</span>
      </div>
    </div>
    <button class="home-bell">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>
  </div>

  <div class="page-content">

    <!-- DESTAQUE: PEDIDO EM ANDAMENTO -->
    @if (pedidoAtivo) {
      <button class="home-pedido-ativo" (click)="verPedidos()">
        <div class="home-pedido-ativo__icone">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div class="home-pedido-ativo__info">
          <span class="home-pedido-ativo__titulo">
            @if (pedidosAtivos.length > 1) {
              {{ pedidosAtivos.length }} pedidos em andamento
            } @else {
              Pedido em andamento
            }
          </span>
          <span class="home-pedido-ativo__sub">{{ pedidoAtivo.restaurant.name }} · {{ statusLabel(pedidoAtivo.status) }}</span>
        </div>
        <svg class="home-pedido-ativo__seta" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    }

    <!-- DESTAQUE: SERVIÇO EM ANDAMENTO -->
    @if (servicoResumo) {
      <button class="home-pedido-ativo" (click)="verServicos()">
        <div class="home-pedido-ativo__icone">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        <div class="home-pedido-ativo__info">
          <span class="home-pedido-ativo__titulo">
            @if (servicosAtivos > 1) {
              {{ servicosAtivos }} serviços em andamento
            } @else {
              Serviço em andamento
            }
          </span>
          <span class="home-pedido-ativo__sub">{{ servicoResumo.titulo }} · {{ servicoResumo.subtitulo }}</span>
        </div>
        @if (servicoResumo.destaque) {
          <span class="home-pedido-ativo__badge">Responder</span>
        }
        <svg class="home-pedido-ativo__seta" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    }

    <!-- DESTAQUE: OUTRAS CATEGORIAS EM ANDAMENTO (hospedagem, aluguel, transporte, compra e venda) -->
    @for (atividade of atividades; track atividade.categoria) {
      <button class="home-pedido-ativo" (click)="navegar(atividade.rota)">
        <div class="home-pedido-ativo__icone">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <div class="home-pedido-ativo__info">
          <span class="home-pedido-ativo__titulo">{{ atividade.titulo }}</span>
          <span class="home-pedido-ativo__sub">{{ atividade.categoria }} · {{ atividade.subtitulo }}</span>
        </div>
        <svg class="home-pedido-ativo__seta" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    }

    <div class="home-servicos">
      @for (servico of servicos; track servico.label) {
        <button
          class="home-servico-btn"
          [class.disabled]="!servico.rota"
          (click)="navegar(servico.rota)">
          {{ servico.label }}
        </button>
      }
    </div>
  </div>

  <app-bottom-nav-cliente tabAtiva="inicio"></app-bottom-nav-cliente>

</div>
